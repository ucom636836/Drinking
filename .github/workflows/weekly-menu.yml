name: 每週價目表更新

on:
  schedule:
    - cron: "0 22 * * 0"   # UTC 週日 22:00 = 台北時間週一 06:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓取並整理價目表
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-menus.mjs
      - name: 開 PR(有變動才開)
        if: steps.run.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="menu-update/$(TZ=Asia/Taipei date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add menu-updates.json
          git commit -m "每週價目表更新 $(TZ=Asia/Taipei date +%F)"
          git push --force origin "$BRANCH"
          gh pr create --title "每週價目表更新 $(TZ=Asia/Taipei date +%F)" --body-file pr-body.md --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            || gh pr edit "$BRANCH" --body-file pr-body.md
