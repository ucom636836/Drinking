<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C636飲料訂購</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#2b2b2b;--mute:#777;--line:#e4e0d6;--pri:#c8553d;--pri2:#a9422d;--ok:#2f7d5b}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--card:#292724;--ink:#eee;--mute:#aaa;--line:#3d3a35;--pri:#e0715a;--pri2:#c8553d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px;flex:1 1 130px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
button{font:inherit;border:0;border-radius:8px;padding:9px 14px;background:var(--pri);color:#fff;cursor:pointer}
button:hover{background:var(--pri2)}button.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.sm{padding:3px 9px;font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tab{padding:5px 12px;border-radius:99px;border:1px solid var(--line);cursor:pointer;background:var(--bg)}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.menu{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.mi{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.mi:last-child{border:0}.mi:hover{background:var(--bg)}.mi.on{background:var(--pri);color:#fff}
.mi small{opacity:.8;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:12px}
.tot{font-weight:700;text-align:right;margin-top:8px}
textarea{min-height:150px;font-family:inherit}
.hint{color:var(--mute);font-size:12px}
.sel{margin:6px 0;font-weight:600}
details summary{cursor:pointer;color:var(--pri)}
.paid{color:var(--ok)}.unpaid{color:var(--pri)}.pay label{flex-direction:row;align-items:center;color:var(--ink);font-size:14px;flex:0 1 auto;gap:6px}.pay input{width:auto}
canvas{max-width:100%;border:1px solid var(--line);border-radius:8px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>🥤 C636飲料訂購 <span id="mode" class="hint"></span></h1>

<div class="card">
  <h2>選擇日期與店家(台北市大安區)</h2>
  <div class="row">
    <label>日期<input type="date" id="date"></label>
    <label>店家<select id="store"></select></label>
    <button class="ghost" id="priceUpdate" title="讀取 menu-updates.json 並更新菜單價格">🔄 價格更新</button>
    <button id="newOrder">＋ 新增這天的訂單</button>
  </div>
  <div class="tabs" id="orderTabs"></div>
  <div class="hint" style="margin-top:8px">同一天可建立多張訂單(例如不同店家)。<span id="modeHint"></span></div>
</div>

<div id="main" hidden>
<div class="grid">
  <div class="card">
    <h2>菜單 <span id="menuTitle" class="hint"></span></h2>
    <div class="menu" id="menu"></div>
    <details style="margin-top:10px"><summary>編輯此店菜單 / 價格</summary>
      <p class="hint">每行一品項:品名,中杯價,大杯價(無大杯可省略)。菜單與價格為參考範例,請以店家現行菜單為準。</p>
      <textarea id="menuEdit"></textarea>
      <button class="sm" id="saveMenu">儲存菜單</button>
      <button class="sm ghost" id="resetMenu">還原預設</button>
    </details>
    <details style="margin-top:8px"><summary>新增自訂店家</summary>
      <div class="row" style="margin-top:6px"><label>店名<input id="customName" placeholder="例:某某茶飲 (大安店)"></label><button class="sm" id="addStore">新增</button></div>
    </details>
  </div>

  <div class="card">
    <h2>我要訂</h2>
    <div class="sel" id="picked">請先點選左側品項</div>
    <div class="row">
      <label>訂購人<input id="who" list="whoList" placeholder="姓名"></label>
      <datalist id="whoList"></datalist>
      <label>杯型<select id="size"><option value="m">中杯</option><option value="l">大杯</option></select></label>
      <label>數量<input type="number" id="qty" min="1" value="1"></label>
    </div>
    <div id="favs"></div>
    <div class="row" style="margin-top:8px">
      <label>甜度<select id="sweet"></select></label>
      <label>冰塊<select id="ice"></select></label>
      <label>加料<select id="top"></select></label>
    </div>
    <label style="margin-top:8px">備註<input id="note" placeholder="例:少冰、不要吸管"></label>
    <div style="margin-top:10px"><button id="add">🛒 新增到購物車</button></div>
  </div>
</div>

<div class="card">
  <h2>購物車 <span class="hint" id="cartMeta"></span></h2>
  <div class="row" style="margin-bottom:10px">
    <label>截止時間(選填)<input type="datetime-local" id="deadline"></label>
    <button class="ghost" id="lockBtn">🔒 收單</button>
    <span class="hint" id="lockState"></span>
  </div>
  <div style="overflow-x:auto"><table id="cart"></table></div>
  <div class="tot" id="total"></div>
  <div id="pay" style="margin-top:12px"></div>
  <div class="row" style="margin-top:12px">
    <button id="mkText">產出文字</button>
    <button id="mkImg">匯出圖片</button>
    <button class="ghost" id="clearCart">清空購物車</button>
    <button class="ghost" id="delOrder">刪除此訂單</button>
  </div>
  <div id="out" hidden>
    <textarea id="txt" readonly></textarea>
    <button class="sm" id="copy">複製文字</button> <span class="hint" id="copied"></span>
  </div>
  <div id="imgOut" hidden>
    <canvas id="cv"></canvas><br>
    <button class="sm" id="dl">下載圖片 (PNG)</button>
  </div>
</div>
</div>

<div class="card">
  <h2>歷史紀錄與統計</h2>
  <label style="max-width:200px">範圍<select id="hRange"><option value="all">全部</option><option value="month">本月</option><option value="30">近 30 天</option></select></label>
  <div id="hist"></div>
</div>
</div>

<script type="module">
/* 菜單(2026-11 依第三方整理文更新,北部價,僅供參考,請以門市為準,可在頁面內自行編輯):[品名, 中杯, 大杯] */
const STORES = {
 "50嵐 (大安區)":[["四季春青茶",35,40],["茉莉綠茶",35,40],["阿薩姆紅茶",35,40],["黃金烏龍",35,40],["波霸奶茶",50,60],["珍珠奶茶",50,60],["冰淇淋紅茶",50,60],["多多綠茶",50,60],["波霸紅茶拿鐵",60,75]],
 "清心福全 (大安區)":[["珍珠奶茶",45,55],["梅子綠茶",40,50],["錫蘭奶紅",45,55],["鮮奶茶",50,65],["桂圓鮮奶茶",60,75],["珍珠琥珀黑糖鮮奶",65,75],["頂級可可拿鐵",60,80],["珍珠蜂蜜鮮奶普洱",50,70]],
 "迷客夏 Milksha (大安區)":[["大甲芋頭鮮奶",85,100],["珍珠大正紅茶拿鐵",65,80],["迷客夏紅茶拿鐵",60,75],["青檸香茶",50,60],["大正紅茶",35,45],["雪藏紅茶拿鐵",70,85],["娜杯紅茶拿鐵",70,85]],
 "CoCo都可 (大安區)":[["21歲輕檸烏龍",45,55],["百香綠茶",45,55],["芒果綠茶",45,55],["金桔檸檬",60,70],["茉莉綠茶",35,40],["四季春青茶",35,40],["阿薩姆奶茶",40,50],["珍珠奶茶",50,60],["粉角奶茶",50,60],["珍珠鮮奶茶",65,75],["粉角鮮奶茶",65,75],["四季珍椰青",50,55],["生椰楊枝甘露",70,90],["芒果冰沙",50,60]],
 "大苑子 (大安區)":[["愛玉檸檬",55,65],["台灣鮮柳橙綠",65,75],["玫瑰荔枝",60,70],["百香果綠茶",60,70],["鮮榨柳丁汁",65,75],["黑糖珍珠鮮奶",70,80]],
 "得正 (大安區)":[["紅茶",25,30],["綠茶",25,30],["春烏龍",30,35],["焙烏龍",30,35],["奶茶",45,50],["焙烏龍奶茶",45,50],["珍珠奶茶",55,60],["黃金珍珠奶綠",55,60],["檸檬春烏龍",55,65],["紅茶鮮奶",55,65],["輕烏龍鮮奶",55,65],["芝士奶蓋春烏龍",50,60]],
 "一沐日 (大安區)":[["粉粿鮮奶茶",70,80],["黑糖粉粿鮮奶",75,85],["芝士奶蓋紅茶",65,75],["柚香綠茶",60,70],["二十一世紀",50,60]],
 "可不可熟成紅茶 (大安區)":[["熟成紅茶",35,40],["春芽冷露",40,45],["輕纖穀奈茶",40,50],["熟檸紅茶",45,55],["胭脂紅茶",45,50],["白玉奶茶",50,60],["胭脂多多",50,60],["春梅冰茶",50,60],["白玉歐蕾",60,70]],
 "五桐號 (大安區)":[["桐奶茶",55,65],["五桐奶蓋紅茶",60,70],["桂花烏龍",40,50],["極品鐵觀音",45,55],["紅茶拿鐵",60,70]],
 "麻古茶坊 (大安區)":[["葡萄柚綠",70,80],["芝芝葡萄柚",80,90],["蘋果綠",50,60],["翡翠烏龍",35,45],["麻古奶茶",55,65]],
 "龜記茗品 (大安區)":[["紅茶",30,40],["綠茶",30,40],["紅茶鮮奶",65,80],["招牌鮮奶茶",60,75],["龜記冬瓜茶",35,45]],
 "鶴茶樓 (大安區)":[["鶴記芝麻糊凍鶴頂那堤",70,80],["鶴頂紅茶",30,35],["金萱青茶",30,35],["綺夢那堤",60,70],["荔枝鶴頂紅茶",60,70],["鶴記鴛鴦凍奶茶",60,70],["杏仁凍桂香烏龍",50,55],["塩選牛奶糖奶蓋綠茶",50,55],["復刻波霸奶茶",55,65]],
 "老賴茶棧 (大安區)":[["老賴紅茶",30,40],["黃金烏龍",30,40],["老賴奶茶",45,55],["檸檬紅茶",45,55],["蜂蜜綠茶",40,50]],
 "再睡5分鐘 (大安區)":[["蜜香紅茶",35,45],["青茶",35,45],["黃金烏龍鮮奶",60,70],["桂花烏龍",40,50],["蕎麥紅茶",35,45]]
};
const SWEET=["正常糖","少糖(7分)","半糖","微糖(3分)","無糖"];
const ICE=["正常冰","少冰","微冰","去冰","常溫","溫","熱"];
const TOP=[["不加料",0],["珍珠",10],["椰果",10],["仙草凍",10],["布丁",15],["波霸",10],["寒天",10],["奶蓋",20]];

const $=id=>document.getElementById(id);
const KEY="drink-order-v1";
const db={orders:[],menus:{},custom:[]};
let curOrder=null,picked=null,menuKey="";
let B;
const onData=()=>{renderStoreSel();renderTabs();renderHist();$("modeHint").textContent=B===local?"資料儲存在本機瀏覽器。":"資料即時同步給所有人。"};
const local={
  mode:"本機模式(資料不共用)",
  async init(){try{Object.assign(db,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}onData()},
  persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}onData()},
  async addOrder(o){db.orders.push(o);this.persist()},
  async delOrder(id){db.orders=db.orders.filter(o=>o.id!==id);this.persist()},
  async setOrder(id,p){Object.assign(db.orders.find(o=>o.id===id),p);this.persist()},
  async setPaid(id,w,on){const o=db.orders.find(o=>o.id===id),a=(o.paid||[]).filter(x=>x!==w);if(on)a.push(w);o.paid=a;this.persist()},
  async addItem(id,it){db.orders.find(o=>o.id===id).items.push(it);this.persist()},
  async delItem(id,it){const o=db.orders.find(o=>o.id===id);o.items=o.items.filter(i=>i.id!==it.id);this.persist()},
  async clearItems(id){db.orders.find(o=>o.id===id).items=[];this.persist()},
  async saveMenu(n,m){db.menus[n]=m;this.persist()},
  async resetMenu(n){delete db.menus[n];this.persist()},
  async addStore(n,m){db.custom.push(n);db.menus[n]=m;this.persist()}
};
function askPassword(msg){
  return new Promise(res=>{
    const d=document.createElement("div");
    d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9";
    d.innerHTML=`<form class="card" style="width:min(340px,90vw);margin:0"><h2>🔒 ${msg}</h2><input type="password" autocomplete="current-password" required><div style="margin-top:10px"><button>登入</button></div></form>`;
    document.body.append(d);const i=d.querySelector("input");i.focus();
    d.querySelector("form").onsubmit=e=>{e.preventDefault();d.remove();res(i.value)};
  });
}
async function makeFirebase(cfg){
  const V="10.12.2",u=f=>`https://www.gstatic.com/firebasejs/${V}/firebase-${f}.js`;
  const {initializeApp}=await import(u("app"));
  const F=await import(u("firestore"));
  const app=initializeApp(cfg),fdb=F.getFirestore(app);
  let ensureLogin=async()=>{};
  if(cfg.accessEmail){
    const A=await import(u("auth")),auth=A.getAuth(app);
    await auth.authStateReady();
    ensureLogin=async()=>{
      while(!auth.currentUser){
        const pw=await askPassword(auth.__tried?"密碼錯誤,請再試一次":"請輸入公司訂餐密碼");
        auth.__tried=true;
        try{await A.signInWithEmailAndPassword(auth,cfg.accessEmail,pw)}catch(e){console.warn(e)}
      }
    };
  }
  const od=id=>F.doc(fdb,"orders",id),sd=n=>F.doc(fdb,"stores",encodeURIComponent(n));
  return {
    mode:"☁ 共用模式(即時同步)",
    async init(){
      await ensureLogin();
      await new Promise((res,rej)=>{let n=0;const ok=()=>{if(++n===2)res()};
        F.onSnapshot(F.collection(fdb,"orders"),sn=>{db.orders=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.created||0)-(b.created||0));onData();ok()},rej);
        F.onSnapshot(F.collection(fdb,"stores"),sn=>{db.menus={};db.custom=[];sn.docs.forEach(d=>{const x=d.data();db.menus[x.name]=JSON.parse(x.items);if(x.custom)db.custom.push(x.name)});onData();ok()},rej);
      });
    },
    addOrder:o=>F.setDoc(od(o.id),{date:o.date,store:o.store,items:[],created:Date.now()}),
    delOrder:id=>F.deleteDoc(od(id)),
    setOrder:(id,p)=>F.updateDoc(od(id),p),
    setPaid:(id,w,on)=>F.updateDoc(od(id),{paid:on?F.arrayUnion(w):F.arrayRemove(w)}),
    addItem:(id,it)=>F.updateDoc(od(id),{items:F.arrayUnion(it)}),
    delItem:(id,it)=>F.updateDoc(od(id),{items:F.arrayRemove(it)}),
    clearItems:id=>F.updateDoc(od(id),{items:[]}),
    saveMenu:(n,m)=>F.setDoc(sd(n),{name:n,items:JSON.stringify(m),custom:db.custom.includes(n)}),
    resetMenu:n=>db.custom.includes(n)?F.setDoc(sd(n),{name:n,items:JSON.stringify([["範例飲料",50,60]]),custom:true}):F.deleteDoc(sd(n)),
    addStore:(n,m)=>F.setDoc(sd(n),{name:n,items:JSON.stringify(m),custom:true})
  };
}
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const allStores=()=>[...Object.keys(STORES),...db.custom];
const menuOf=n=>db.menus[n]||STORES[n]||[];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fillSel(el,arr){el.innerHTML=arr.map((v,i)=>`<option value="${i}">${esc(Array.isArray(v)?(v[1]?v[0]+" +$"+v[1]:v[0]):v)}</option>`).join("")}
const TAG={new:"(新)",pending:"(待確認)",none:"(無)"};
let tags={};try{tags=JSON.parse(localStorage.getItem("drink-tags"))||{}}catch(e){}
function renderStoreSel(){
  const v=$("store").value;
  $("store").innerHTML=allStores().map(s=>`<option value="${esc(s)}">${esc(s)}${TAG[tags[s]]||""}</option>`).join("");
  if(v&&allStores().includes(v))$("store").value=v;
}
async function init(){
  $("date").value=today();
  try{$("who").value=localStorage.getItem("drink-who")||""}catch(e){}
  fillSel($("sweet"),SWEET);fillSel($("ice"),ICE);fillSel($("top"),TOP);
  $("sweet").value=2;$("ice").value=1;
  B=local;
  try{
    const m=await import("./firebase-config.js");
    if(m.default&&m.default.projectId)B=await makeFirebase(m.default);
  }catch(e){console.warn("Firebase 未啟用,使用本機模式",e)}
  $("mode").textContent=B.mode;
  try{await B.init()}catch(e){
    console.error(e);alert("連線 Firestore 失敗,改用本機模式。\n請檢查 firebase-config.js 與 Firestore 規則。");
    B=local;$("mode").textContent=B.mode;await B.init();
  }
}
function dayOrders(){return db.orders.filter(o=>o.date===$("date").value)}
function renderTabs(){
  const list=dayOrders();
  if(!list.find(o=>o.id===curOrder))curOrder=list[0]?.id||null;
  $("orderTabs").innerHTML=list.map(o=>`<span class="tab ${o.id===curOrder?"on":""}" data-id="${o.id}">${esc(o.store)} (${o.items.reduce((a,i)=>a+i.qty,0)}杯)</span>`).join("")||'<span class="hint">這天還沒有訂單,請按「新增這天的訂單」</span>';
  const o=cur();$("main").hidden=!o;
  if(o){const k=o.store+JSON.stringify(menuOf(o.store));if(k!==menuKey){menuKey=k;renderMenu()}renderCart();renderNames();renderLock();renderPay();renderFavs()}
}
const cur=()=>db.orders.find(o=>o.id===curOrder);

function renderMenu(){
  const o=cur(),m=menuOf(o.store);picked=null;$("picked").textContent="請先點選左側品項";
  $("menuTitle").textContent="— "+o.store;
  $("menu").innerHTML=m.map((x,i)=>`<div class="mi" data-i="${i}"><span>${esc(x[0])}</span><small>中 $${x[1]}${x[2]?" / 大 $"+x[2]:""}</small></div>`).join("");
  $("menuEdit").value=m.map(x=>x.join(",")).join("\n");
}
function renderNames(){
  const names=[...new Set(db.orders.flatMap(o=>o.items.map(i=>i.who)))];
  $("whoList").innerHTML=names.map(n=>`<option value="${esc(n)}">`).join("");
}
function price(i){return (i.price+i.top)*i.qty}
function renderCart(){
  const o=cur(),n=o.items.reduce((a,i)=>a+i.qty,0),sum=o.items.reduce((a,i)=>a+price(i),0);
  $("cartMeta").textContent=`— ${o.date} ${o.store}`;
  $("cart").innerHTML=o.items.length?`<tr><th>訂購人</th><th>品項</th><th>規格</th><th>數量</th><th>小計</th><th></th></tr>`+
   o.items.map(i=>`<tr><td>${esc(i.who)}</td><td>${esc(i.name)}</td><td>${spec(i)}</td><td>${i.qty}</td><td>$${price(i)}</td><td><button class="sm ghost" data-del="${i.id}">刪</button></td></tr>`).join(""):'<tr><td class="hint">購物車是空的</td></tr>';
  $("total").textContent=`共 ${n} 杯,合計 $${sum}`;
}
function spec(i){return [i.size==="l"?"大杯":"中杯",i.sweet,i.ice,i.topName!=="不加料"?i.topName:"",i.note].filter(Boolean).map(esc).join(" / ")}
function specPlain(i){return [i.size==="l"?"大杯":"中杯",i.sweet,i.ice,i.topName!=="不加料"?i.topName:"",i.note?`(${i.note})`:""].filter(Boolean).join(" ")}

$("date").onchange=renderTabs;
$("newOrder").onclick=()=>{
  const o={id:uid(),date:$("date").value,store:$("store").value,items:[]};
  if(!o.date)return alert("請選擇日期");
  curOrder=o.id;B.addOrder(o);
};
$("orderTabs").onclick=e=>{const t=e.target.closest(".tab");if(t){curOrder=t.dataset.id;renderTabs()}};
$("menu").onclick=e=>{
  const r=e.target.closest(".mi");if(!r)return;
  picked=+r.dataset.i;const x=menuOf(cur().store)[picked];
  document.querySelectorAll(".mi").forEach(el=>el.classList.toggle("on",el===r));
  $("picked").textContent="已選:"+x[0];
  if(!x[2])$("size").value="m";
};
$("add").onclick=()=>{
  const o=cur();if(isLocked(o))return alert("此訂單已收單");if(picked==null)return alert("請先點選品項");
  const who=$("who").value.trim();if(!who)return alert("請輸入訂購人");
  const qty=Math.max(1,parseInt($("qty").value)||1),x=menuOf(o.store)[picked];
  const size=$("size").value;
  if(size==="l"&&!x[2])return alert("此品項沒有大杯");
  const t=TOP[+$("top").value];
  try{localStorage.setItem("drink-who",who)}catch(e){}
  B.addItem(o.id,{id:uid(),who,name:x[0],size,price:size==="l"?x[2]:x[1],qty,sweet:SWEET[+$("sweet").value],ice:ICE[+$("ice").value],topName:t[0],top:t[1],note:$("note").value.trim()});
  $("note").value="";$("qty").value=1;
};
$("cart").onclick=e=>{const id=e.target.dataset.del;if(id){const o=cur();if(isLocked(o))return alert("此訂單已收單");B.delItem(o.id,o.items.find(i=>i.id===id))}};
$("clearCart").onclick=()=>{if(isLocked(cur()))return alert("此訂單已收單");if(confirm("確定清空購物車?"))B.clearItems(curOrder)};
$("delOrder").onclick=()=>{if(confirm("確定刪除整張訂單?"))B.delOrder(curOrder)};
$("saveMenu").onclick=()=>{
  const m=$("menuEdit").value.split("\n").map(l=>l.split(/[,，]/).map(s=>s.trim())).filter(a=>a[0]&&+a[1]>0).map(a=>[a[0],+a[1],+a[2]||0]);
  if(!m.length)return alert("格式錯誤");B.saveMenu(cur().store,m);
};
$("resetMenu").onclick=()=>B.resetMenu(cur().store);

$("priceUpdate").onclick=async()=>{
  let d;
  try{const r=await fetch("menu-updates.json",{cache:"no-store"});if(!r.ok)throw 0;d=await r.json()}
  catch(e){return alert("讀取 menu-updates.json 失敗。請用 http(s) 開啟頁面(GitHub Pages),不能用 file://。")}
  const st=d.stores||{},all=allStores();
  const todo=all.filter(n=>st[n]?.status==="new"&&st[n].menu&&JSON.stringify(st[n].menu)!==JSON.stringify(menuOf(n)));
  if(todo.length&&!confirm("以下店家的菜單將被覆蓋(含你自行編輯的內容):\n"+todo.join("\n")+"\n\n繼續?"))return;
  for(const n of todo)await B.saveMenu(n,st[n].menu);
  tags={};
  all.forEach(n=>{const s=st[n]?.status;tags[n]=s==="new"||s==="pending"?s:"none"});
  try{localStorage.setItem("drink-tags",JSON.stringify(tags))}catch(e){}
  renderStoreSel();
  const c=k=>all.filter(n=>tags[n]===k).length;
  alert(`價格更新完成(資料日期 ${d.date||"?"}):\n(新) ${c("new")} 家、(待確認) ${c("pending")} 家、(無) ${c("none")} 家`);
};

$("addStore").onclick=()=>{
  const n=$("customName").value.trim();if(!n||allStores().includes(n))return;
  B.addStore(n,[["範例飲料",50,60]]);$("customName").value="";
  setTimeout(()=>{$("store").value=n},300);
  alert("已新增,請按「新增這天的訂單」後編輯菜單");
};

function buildText(){
  const o=cur();if(!o.items.length)return null;
  const L=[`【飲料訂單】${o.date} ${o.store}`,""];
  const by={};o.items.forEach(i=>(by[i.who]=by[i.who]||[]).push(i));
  Object.entries(by).forEach(([w,a])=>{L.push(w+":");a.forEach(i=>L.push(`  ${i.name} x${i.qty} ${specPlain(i)} $${price(i)}`))});
  const sum={};o.items.forEach(i=>{const k=`${i.name} ${specPlain({...i,note:""})}`;sum[k]=(sum[k]||0)+i.qty});
  L.push("","── 品項統計 ──");Object.entries(sum).forEach(([k,v])=>L.push(`${k} x${v}`));
  L.push("",`共 ${o.items.reduce((a,i)=>a+i.qty,0)} 杯,合計 $${o.items.reduce((a,i)=>a+price(i),0)}`);
  return L.join("\n");
}
$("mkText").onclick=()=>{const t=buildText();if(!t)return alert("購物車是空的");$("txt").value=t;$("out").hidden=false;$("copied").textContent=""};
$("copy").onclick=async()=>{
  try{await navigator.clipboard.writeText($("txt").value)}catch(e){$("txt").select();document.execCommand("copy")}
  $("copied").textContent="已複製 ✓";
};
$("mkImg").onclick=()=>{
  const o=cur();if(!o.items.length)return alert("購物車是空的");
  const F='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif',S=2,W=760,rowH=34;
  const by={};o.items.forEach(i=>(by[i.who]=by[i.who]||[]).push(i));
  const rows=[];Object.entries(by).forEach(([w,a])=>a.forEach((i,k)=>rows.push({w:k?"":w,i})));
  const sum={};o.items.forEach(i=>{const k=`${i.name} ${specPlain({...i,note:""})}`;sum[k]=(sum[k]||0)+i.qty});
  const sumKeys=Object.keys(sum);
  const H=120+rows.length*rowH+60+sumKeys.length*26+70;
  const c=$("cv");c.width=W*S;c.height=H*S;const g=c.getContext("2d");g.scale(S,S);
  g.fillStyle="#fff";g.fillRect(0,0,W,H);
  g.fillStyle="#c8553d";g.fillRect(0,0,W,70);
  g.fillStyle="#fff";g.font=`bold 24px ${F}`;g.fillText("飲料訂單",24,34);
  g.font=`15px ${F}`;g.fillText(`${o.date}  ${o.store}`,24,58);
  let y=100;g.fillStyle="#888";g.font=`13px ${F}`;
  [["訂購人",24],["品項",120],["規格 / 備註",270],["數量",580],["小計",650]].forEach(([t,x])=>g.fillText(t,x,y));
  g.strokeStyle="#ddd";g.beginPath();g.moveTo(24,y+8);g.lineTo(W-24,y+8);g.stroke();y+=rowH-4;
  const fit=(t,max)=>{while(g.measureText(t).width>max&&t.length>1)t=t.slice(0,-1);return t};
  rows.forEach((r,n)=>{
    if(n%2){g.fillStyle="#faf7f2";g.fillRect(24,y-20,W-48,rowH)}
    g.fillStyle="#222";g.font=`bold 15px ${F}`;g.fillText(fit(r.w,90),24,y);
    g.font=`15px ${F}`;g.fillText(fit(r.i.name,140),120,y);
    g.fillStyle="#555";g.font=`13px ${F}`;g.fillText(fit(specPlain(r.i).replace(/^(中杯|大杯) /,m=>m),290),270,y);
    g.fillStyle="#222";g.font=`15px ${F}`;g.fillText(String(r.i.qty),590,y);g.fillText("$"+price(r.i),650,y);
    y+=rowH;
  });
  y+=14;g.fillStyle="#c8553d";g.font=`bold 15px ${F}`;g.fillText("品項統計",24,y);y+=24;
  g.fillStyle="#333";g.font=`14px ${F}`;
  sumKeys.forEach(k=>{g.fillText(fit(k,600),24,y);g.fillText("x"+sum[k],650,y);y+=26});
  y+=10;g.strokeStyle="#c8553d";g.beginPath();g.moveTo(24,y-14);g.lineTo(W-24,y-14);g.stroke();
  g.fillStyle="#c8553d";g.font=`bold 20px ${F}`;g.textAlign="right";
  g.fillText(`共 ${o.items.reduce((a,i)=>a+i.qty,0)} 杯 　合計 $${o.items.reduce((a,i)=>a+price(i),0)}`,W-24,y+14);
  g.textAlign="left";
  $("imgOut").hidden=false;
};
$("dl").onclick=()=>{const a=document.createElement("a");a.download=`飲料訂單_${cur().date}.png`;a.href=$("cv").toDataURL("image/png");a.click()};

const isLocked=o=>!!(o&&(o.locked||(o.deadline&&Date.now()>new Date(o.deadline).getTime())));
function renderLock(){
  const o=cur();if(!o)return;const L=isLocked(o);
  if(document.activeElement!==$("deadline"))$("deadline").value=o.deadline||"";
  $("lockBtn").textContent=o.locked?"🔓 重新開放":"🔒 收單";
  $("lockState").textContent=L?(o.locked?"已收單":"已過截止時間,已收單"):(o.deadline?"截止前可繼續點餐":"開放點餐中");
  $("add").disabled=L;
}
$("lockBtn").onclick=()=>{const o=cur();B.setOrder(o.id,{locked:!o.locked,...(o.locked?{deadline:""}:{})})};
$("deadline").onchange=()=>B.setOrder(cur().id,{deadline:$("deadline").value});
setInterval(renderLock,30000);

const byWho=o=>{const m={};o.items.forEach(i=>{const a=m[i.who]=m[i.who]||{cups:0,sum:0};a.cups+=i.qty;a.sum+=price(i)});return m};
function renderPay(){
  const o=cur(),m=byWho(o),paid=o.paid||[];
  let got=0,due=0;Object.entries(m).forEach(([w,a])=>paid.includes(w)?got+=a.sum:due+=a.sum);
  $("pay").className="pay";
  $("pay").innerHTML=Object.keys(m).length?`<h2>付款追蹤 <span class="hint">已收 <b class="paid">$${got}</b> / 未收 <b class="unpaid">$${due}</b></span></h2><div class="row">`+
    Object.entries(m).map(([w,a])=>`<label><input type="checkbox" data-pay="${esc(w)}" ${paid.includes(w)?"checked":""}>${esc(w)} $${a.sum}</label>`).join("")+"</div>":"";
}
$("pay").onchange=e=>{const w=e.target.dataset.pay;if(w!=null)B.setPaid(curOrder,w,e.target.checked)};

let favList=[];
function renderFavs(){
  const o=cur(),who=$("who").value.trim(),el=$("favs");favList=[];
  if(!o||!who){el.innerHTML="";return}
  const m=menuOf(o.store),map={};
  db.orders.filter(x=>x.store===o.store).forEach(x=>x.items.filter(i=>i.who===who).forEach(i=>{
    const k=[i.name,i.size,i.sweet,i.ice,i.topName,i.note].join("|");(map[k]=map[k]||{i,n:0}).n+=i.qty}));
  favList=Object.values(map).sort((a,b)=>b.n-a.n).filter(f=>m.find(x=>x[0]===f.i.name&&(f.i.size!=="l"||x[2]))).slice(0,5);
  el.innerHTML=favList.length?`<div class="hint" style="margin-top:8px">${esc(who)} 的常點(點一下直接加入 1 杯):</div><div class="tabs">`+
    favList.map((f,k)=>`<span class="tab" data-fav="${k}">${esc(f.i.name)} ${esc(specPlain(f.i))} ×${f.n}</span>`).join("")+"</div>":"";
}
$("who").oninput=renderFavs;
$("favs").onclick=e=>{
  const t=e.target.closest("[data-fav]");if(!t)return;
  const o=cur(),f=favList[+t.dataset.fav];if(!f)return;
  if(isLocked(o))return alert("此訂單已收單");
  const x=menuOf(o.store).find(x=>x[0]===f.i.name);
  try{localStorage.setItem("drink-who",f.i.who)}catch(e){}
  B.addItem(o.id,{...f.i,id:uid(),qty:1,price:f.i.size==="l"?x[2]:x[1]});
};

function renderHist(){
  const r=$("hRange").value,iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  let from="";
  if(r==="month")from=iso(new Date()).slice(0,8)+"01";
  if(r==="30"){const d=new Date();d.setDate(d.getDate()-30);from=iso(d)}
  const L=db.orders.filter(o=>o.date>=from).sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
  if(!L.length){$("hist").innerHTML='<p class="hint">這段期間沒有訂單</p>';return}
  const ppl={},items={};let cups=0,sum=0;
  L.forEach(o=>{const paid=o.paid||[];o.items.forEach(i=>{
    const a=ppl[i.who]=ppl[i.who]||{cups:0,sum:0,unpaid:0};a.cups+=i.qty;a.sum+=price(i);if(!paid.includes(i.who))a.unpaid+=price(i);
    items[i.name]=(items[i.name]||0)+i.qty;cups+=i.qty;sum+=price(i)})});
  const tbl=(h,rows)=>`<div style="overflow-x:auto"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.join("")}</table></div>`;
  $("hist").innerHTML=`<p class="hint">${L.length} 張訂單、共 ${cups} 杯、合計 $${sum}</p>`+
   `<h2 style="margin-top:10px">每人累計</h2>`+tbl(["姓名","杯數","金額","未付款"],Object.entries(ppl).sort((a,b)=>b[1].sum-a[1].sum).map(([w,a])=>`<tr><td>${esc(w)}</td><td>${a.cups}</td><td>$${a.sum}</td><td class="${a.unpaid?"unpaid":"paid"}">${a.unpaid?"$"+a.unpaid:"✓"}</td></tr>`))+
   `<h2 style="margin-top:12px">熱門品項</h2>`+tbl(["品項","杯數"],Object.entries(items).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,c])=>`<tr><td>${esc(n)}</td><td>${c}</td></tr>`))+
   `<h2 style="margin-top:12px">訂單列表 <span class="hint">(點一下開啟)</span></h2>`+tbl(["日期","店家","杯數","金額"],L.map(o=>{const q=o.items.reduce((a,i)=>a+i.qty,0);return `<tr class="mi" style="display:table-row" data-jump="${o.id}"><td>${o.date}</td><td>${esc(o.store)}</td><td>${q}</td><td>$${o.items.reduce((a,i)=>a+price(i),0)}</td></tr>`}));
}
$("hRange").onchange=renderHist;
$("hist").onclick=e=>{
  const t=e.target.closest("[data-jump]");if(!t)return;
  const o=db.orders.find(x=>x.id===t.dataset.jump);if(!o)return;
  $("date").value=o.date;curOrder=o.id;renderTabs();window.scrollTo({top:0,behavior:"smooth"});
};
init();
</script>
